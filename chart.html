<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart - Gate Automation Project</title>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #gantt {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <h2>Gantt Chart - Gate Automation System</h2>
    <div id="gantt"></div>
    <script>
        const tasks = [
            { id: "1", name: "Introduction", start: "2024-06-15", end: "2024-07-01" },
            { id: "2", name: "System Planning", start: "2024-07-02", end: "2024-07-20" },
            { id: "3", name: "Requirement & Analysis", start: "2024-07-21", end: "2024-08-15" },
            { id: "4", name: "System Design", start: "2024-08-16", end: "2024-09-10" },
            { id: "5", name: "System Coding & Implementation", start: "2024-09-11", end: "2024-12-10" },
            { id: "6", name: "Testing", start: "2024-12-11", end: "2025-01-10" },
            { id: "7", name: "Conclusion & Future Work", start: "2025-01-11", end: "2025-01-15" },
            { id: "8", name: "References & Final Report", start: "2025-01-16", end: "2025-01-20" },
        ];
        
        const gantt = new Gantt("#gantt", tasks, {
            view_mode: "Month",
            date_format: "YYYY-MM-DD",
            custom_popup_html: task => `<b>${task.name}</b><br>Start: ${task.start}<br>End: ${task.end}`
        });
    </script>
</body>
</html>
